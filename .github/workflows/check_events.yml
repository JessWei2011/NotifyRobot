name: 📣 自選股即時重大訊息與事件監控

on:
  schedule:
    # 提醒：GitHub Actions 使用 UTC 時間（台灣時間 UTC+8，需減 8 小時）
    # 1. 08:30 (UTC 00:30) 盤前最新消息
    - cron: '30 0 * * 1-5'
    # 2. 09:30 (UTC 01:30) 盤中開盤一小時
    - cron: '30 1 * * 1-5'
    # 3. 10:30 (UTC 02:30) 盤中中盤
    - cron: '30 2 * * 1-5'
    # 4. 11:30 (UTC 03:30) 盤中後半場
    - cron: '30 3 * * 1-5'
    # 5. 13:30 (UTC 05:30) 收盤第一時間
    - cron: '30 5 * * 1-5'
    # 6. 21:00 (UTC 13:00) 晚間公告盤點
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  run-check-events:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 建立 .env 檔案
        env:
          ENV_CONTENT: ${{ secrets.ENV }}
        run: |
          python -c "import os, pathlib; pathlib.Path('.env').write_text(os.environ.get('ENV_CONTENT', ''), encoding='utf-8')"

      - name: 執行自選股重大訊息與事件檢查
        run: |
          python main.py --check-events
