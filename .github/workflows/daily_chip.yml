name: 📊 盤後籌碼與自選股分析

on:
  schedule:
    # 1. 盤後初估與自選股分析：台灣時間平日 15:35 (UTC 07:35)
    - cron: '35 7 * * 1-5'
    # 2. 籌碼定案完整更新：台灣時間平日 17:05 (UTC 09:05)
    - cron: '5 9 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '強制重發（略過重複檢查）'
        required: false
        type: boolean
        default: true
      date:
        description: '指定測試交易日 (YYYYMMDD，留空則自動抓最新交易日)'
        required: false
        type: string
        default: ''

jobs:
  run-daily-chip:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 建立 .env 檔案
        env:
          ENV_CONTENT: ${{ secrets.ENV }}
        run: |
          python -c "import os, pathlib; pathlib.Path('.env').write_text(os.environ.get('ENV_CONTENT', ''), encoding='utf-8')"

      - name: 執行盤後籌碼與自選股推播
        run: |
          CMD="python main.py"
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="$CMD --force"
          fi
          if [ -n "${{ inputs.date }}" ]; then
            CMD="$CMD --date ${{ inputs.date }}"
          fi
          echo "執行指令: $CMD"
          $CMD
