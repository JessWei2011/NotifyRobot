name: 🌅 開盤前行事曆

on:
  schedule:
    # 台灣時間平日 08:30 (UTC 00:30)
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  run-morning-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 建立 .env 檔案
        env:
          ENV_CONTENT: ${{ secrets.ENV }}
        run: |
          python -c "import os, pathlib; pathlib.Path('.env').write_text(os.environ.get('ENV_CONTENT', ''), encoding='utf-8')"

      - name: 執行開盤前行事曆推播
        run: |
          python main.py --morning-calendar --force
