name: 💰 大盤法人金額速報

on:
  schedule:
    # 1. 盤後初估速報：台灣時間平日 15:10 (UTC 07:10)
    - cron: '10 7 * * 1-5'
    # 2. 證交所定案最終版：台灣時間平日 17:05 (UTC 09:05)
    - cron: '5 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-market-summary:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 建立 .env 檔案
        env:
          ENV_CONTENT: ${{ secrets.ENV }}
        run: |
          python -c "import os, pathlib; pathlib.Path('.env').write_text(os.environ.get('ENV_CONTENT', ''), encoding='utf-8')"

      - name: 執行大盤法人金額速報推播
        run: |
          python main.py --market-summary --force
